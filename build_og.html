<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background-color: #0b0b0b;
            box-sizing: border-box;
            border: 8px solid #F0E226;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 290px 220px;
            gap: 20px;
            padding: 40px;
            height: 100%;
            box-sizing: border-box;
        }

        .screenshot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #111;
        }

        .img-1 {
            grid-column: 1 / 4;
            grid-row: 1 / 2;
            object-position: top center;
        }

        .img-2 {
            grid-column: 4 / 7;
            grid-row: 1 / 2;
            object-position: top center;
        }

        .img-3 {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            object-position: center;
        }

        .img-4 {
            grid-column: 3 / 5;
            grid-row: 2 / 3;
            object-position: center;
        }

        .img-5 {
            grid-column: 5 / 7;
            grid-row: 2 / 3;
            object-position: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Image 1 (Top Left) -->
        <img src="file:///Users/boyka777/Documents/AI%20AGENCY/MY%20WEBSITE/Hidden%20Meta/Screenshot%202026-07-02%20at%2015.01.21.png" class="screenshot img-1" alt="Screenshot 1">
        
        <!-- Image 2 (Top Right) -->
        <img src="file:///Users/boyka777/Documents/AI%20AGENCY/MY%20WEBSITE/Hidden%20Meta/Screenshot%202026-07-02%20at%2015.01.39.png" class="screenshot img-2" alt="Screenshot 2">
        
        <!-- Image 3 (Bottom Left) -->
        <img src="file:///Users/boyka777/Documents/AI%20AGENCY/MY%20WEBSITE/Hidden%20Meta/Screenshot%202026-07-02%20at%2015.03.12.png" class="screenshot img-3" alt="Screenshot 3">
        
        <!-- Image 4 (Bottom Mid) -->
        <img src="file:///Users/boyka777/Documents/AI%20AGENCY/MY%20WEBSITE/Hidden%20Meta/Screenshot%202026-07-02%20at%2015.03.59.png" class="screenshot img-4" alt="Screenshot 4">
        
        <!-- Image 5 (Bottom Right) -->
        <img src="file:///Users/boyka777/Documents/AI%20AGENCY/MY%20WEBSITE/Hidden%20Meta/Screenshot%202026-07-02%20at%2015.05.23.png" class="screenshot img-5" alt="Screenshot 5">
    </div>
</body>
</html>
